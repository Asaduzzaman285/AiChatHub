# ─────────────────────────────────────────────
# AI ChatHub — Production
# ─────────────────────────────────────────────
# Standalone file, not an overlay combined with docker-compose.yml via `-f base -f
# this` — Compose merges list-type keys (volumes, ports) by CONCATENATING them, not
# replacing, so there is no clean way to "subtract" dev's bind-mounts/host-ports
# through an overlay. Simpler and less error-prone to define the production shape
# fully here instead: run with
#   docker-compose -f docker-compose.prod.yml up -d --build
#
# What's different from docker-compose.yml, and why:
#   - No `./services/X:/var/www` bind-mounts — every Dockerfile already COPYs the
#     real code into the image (confirmed: services all end in `COPY --chown=www:www . .`),
#     so the mount was only ever a dev convenience for live-reload, never a requirement.
#   - No host `ports:` on internal services — only `caddy` below publishes 80/443.
#     Postgres/Redis/every service-nginx/frontend all stay reachable ONLY on the
#     `aichathub` network, not from outside the box.
#   - No `minio`/`mailpit` — production points FILESYSTEM_DISK/MAIL_* at real external
#     providers (a real S3-compatible bucket, real Mailgun), not in-cluster stand-ins.
#   - Each service's `env_file` still points at `services/X/.env` — that file just
#     needs to BE the production-filled version on this server (copy each
#     `.env.production.example` to `.env` and fill in real values; nothing reads a
#     differently-named file).

networks:
  aichathub:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:

services:

  # ─── INFRASTRUCTURE ───────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: aichathub-postgres
    restart: unless-stopped
    networks: [aichathub]
    environment:
      POSTGRES_DB: ai_chathub_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — no dev default in production}
      # Read by rotate-passwords.sh (runs after init.sql) to overwrite each service's
      # DB user password — init.sql itself is git-tracked and only ever has dev
      # placeholders, real secrets only ever live here.
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD must be set}
      SUB_DB_PASSWORD: ${SUB_DB_PASSWORD:?SUB_DB_PASSWORD must be set}
      WALLET_DB_PASSWORD: ${WALLET_DB_PASSWORD:?WALLET_DB_PASSWORD must be set}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?PAYMENT_DB_PASSWORD must be set}
      BILLING_DB_PASSWORD: ${BILLING_DB_PASSWORD:?BILLING_DB_PASSWORD must be set}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:?AI_DB_PASSWORD must be set}
      CHAT_DB_PASSWORD: ${CHAT_DB_PASSWORD:?CHAT_DB_PASSWORD must be set}
      NOTIF_DB_PASSWORD: ${NOTIF_DB_PASSWORD:?NOTIF_DB_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql
      - ./infrastructure/docker/postgres/rotate-passwords.sh:/docker-entrypoint-initdb.d/20-rotate-passwords.sh
    mem_limit: 1g

  # Daily 03:00 UTC pg_dump -> gzip -> S3-compatible bucket, no local disk involved.
  # Recommend also setting an S3 lifecycle rule on the bucket to auto-expire old
  # backups after N days — a one-time bucket-console setting, not worth scripting here.
  db-backup:
    build: { context: ./infrastructure/docker/postgres, dockerfile: Dockerfile.backup }
    image: aichathub/db-backup:prod
    container_name: aichathub-db-backup
    restart: unless-stopped
    networks: [aichathub]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ai_chathub_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — no dev default in production}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:?BACKUP_S3_BUCKET must be set}
      AWS_ACCESS_KEY_ID: ${BACKUP_AWS_ACCESS_KEY_ID:?BACKUP_AWS_ACCESS_KEY_ID must be set}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_AWS_SECRET_ACCESS_KEY:?BACKUP_AWS_SECRET_ACCESS_KEY must be set}
      AWS_DEFAULT_REGION: ${BACKUP_AWS_REGION:-us-east-1}
      AWS_ENDPOINT: ${BACKUP_AWS_ENDPOINT:?BACKUP_AWS_ENDPOINT must be set (S3-compatible endpoint URL)}
    depends_on: [postgres]
    mem_limit: 128m

  redis:
    image: redis:7-alpine
    container_name: aichathub-redis
    restart: unless-stopped
    networks: [aichathub]
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set — no dev default in production}
    mem_limit: 512m

  # ─── REVERSE PROXY (the only public entry point) ──

  caddy:
    image: caddy:2-alpine
    container_name: aichathub-caddy
    restart: unless-stopped
    networks: [aichathub]
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN must be set (e.g. app.yourdomain.com)}
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN must be set (e.g. api.yourdomain.com)}
    volumes:
      - ./infrastructure/docker/Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [frontend, api-gateway-nginx]

  # ─── AUTH SERVICE ─────────────────────────

  auth-service:
    build: { context: ., dockerfile: infrastructure/docker/php/Dockerfile, args: { SERVICE_DIR: auth-service, PHP_FPM_CONF: www.prod.conf } }
    image: aichathub/auth-service:prod
    container_name: aichathub-auth
    restart: unless-stopped
    networks: [aichathub]
    env_file: [./services/auth-service/.env]
    depends_on: [postgres, redis]
    mem_limit: 384m

  auth-nginx:
    image: nginx:1.25-alpine
    container_name: aichathub-auth-nginx
    restart: unless-stopped
    networks: [aichathub]
    volumes:
      - ./infrastructure/docker/nginx/auth.conf:/etc/nginx/conf.d/default.conf
    depends_on: [auth-service]

  auth-queue-worker:
    image: aichathub/auth-service:prod
    container_name: aichathub-auth-queue-worker
    restart: unless-stopped
    networks: [aichathub]
    env_file: [./services/auth-service/.env]
    depends_on: [postgres, redis]
    command: php artisan queue:work redis --queue=auth --tries=3 --sleep=3
    mem_limit: 256m

  # ─── SUBSCRIPTION SERVICE ─────────────────

  subscription-service:
    build: { context: ., dockerfile: infrastructure/docker/php/Dockerfile, args: { SERVICE_DIR: subscription-service, PHP_FPM_CONF: www.prod.conf } }
    image: aichathub/subscription-service:prod
    container_name: aichathub-subscription
    restart: unless-stopped
    networks: [aichathub]
    env_file: [./services/subscription-service/.env]
    depends_on: [postgres, redis]
    mem_limit: 384m

  subscription-nginx:
    image: nginx:1.25-alpine
    container_name: aichathub-subscription-nginx
    restart: unless-stopped
    networks: [aichathub]
    volumes:
      - ./infrastructure/docker/nginx/subscription.conf:/etc/nginx/conf.d/default.conf
    depends_on: [subscription-service]

  subscription-queue-worker:
    image: aichathub/subscription-service:prod
    container_name: aichathub-subscription-queue-worker
    restart: unless-stopped
    networks: [aichathub]
    env_file: [./services/subscription-service/.env]
    depends_on: [postgres, redis]
    command: php artisan queue:work redis --queue=subscription --tries=3 --sleep=3 --timeout=120
    mem_limit: 256m

  subscription-scheduler:
    image: aichathub/subscription-service:prod
    container_name: aichathub-subscription-scheduler
    restart: unless-stopped
    networks: [aichathub]
    env_file: [./services/subscription-service/.env]
    depends_on: [postgres, redis]
    command: php artisan schedule:work
    mem_limit: 192m

  # ─── WALLET SERVICE ───────────────────────

  wallet-service:
    build: { context: ., dockerfile: infrastructure/docker/php/Dockerfile, args: { SERVICE_DIR: wallet-service, PHP_FPM_CONF: www.prod.conf } }
    image: aichathub/wallet-service:prod
    container_name: aichathub-wallet
    restart: unless-stopped
    networks: [aichathub]
    env_file: [./services/wallet-service/.env]
    depends_on: [postgres, redis]
    mem_limit: 384m

  wallet-nginx:
    image: nginx:1.25-alpine
    container_name: aichathub-wallet-nginx
    restart: unless-stopped
    networks: [aichathub]
    volumes:
      - ./infrastructure/docker/nginx/wallet.conf:/etc/nginx/conf.d/default.conf
    depends_on: [wallet-service]

  wallet-queue-worker:
    image: aichathub/wallet-service:prod
    container_name: aichathub-wallet-queue-worker
    restart: unless-stopped
    networks: [aichathub]
    env_file: [./services/wallet-service/.env]
    depends_on: [postgres, redis]
    command: php artisan queue:work redis --queue=wallet --tries=3 --sleep=3 --timeout=120
    mem_limit: 256m

  wallet-scheduler:
    image: aichathub/wallet-service:prod
    container_name: aichathub-wallet-scheduler
    restart: unless-stopped
    networks: [aichathub]
    env_file: [./services/wallet-service/.env]
    depends_on: [postgres, redis]
    command: php artisan schedule:work
    mem_limit: 192m

  # ─── PAYMENT SERVICE ──────────────────────

  payment-service:
    build: { context: ., dockerfile: infrastructure/docker/php/Dockerfile, args: { SERVICE_DIR: payment-service, PHP_FPM_CONF: www.prod.conf } }
    image: aichathub/payment-service:prod
    container_name: aichathub-payment
    restart: unless-stopped
    networks: [aichathub]
    env_file: [./services/payment-service/.env]
    depends_on: [postgres, redis]
    mem_limit: 384m

  payment-nginx:
    image: nginx:1.25-alpine
    container_name: aichathub-payment-nginx
    restart: unless-stopped
    networks: [aichathub]
    volumes:
      - ./infrastructure/docker/nginx/payment.conf:/etc/nginx/conf.d/default.conf
    depends_on: [payment-service]

  payment-queue-worker:
    image: aichathub/payment-service:prod
    container_name: aichathub-payment-queue-worker
    restart: unless-stopped
    networks: [aichathub]
    env_file: [./services/payment-service/.env]
    depends_on: [postgres, redis]
    command: php artisan queue:work redis --queue=payment --tries=3 --sleep=3 --timeout=120
    mem_limit: 256m

  payment-scheduler:
    image: aichathub/payment-service:prod
    container_name: aichathub-payment-scheduler
    restart: unless-stopped
    networks: [aichathub]
    env_file: [./services/payment-service/.env]
    depends_on: [postgres, redis]
    command: php artisan schedule:work
    mem_limit: 192m

  # ─── AI GATEWAY SERVICE (Octane/Swoole) ───

  ai-gateway-service:
    build: { context: ., dockerfile: infrastructure/docker/php-octane/Dockerfile, args: { SERVICE_DIR: ai-gateway-service } }
    image: aichathub/ai-gateway-service:prod
    container_name: aichathub-ai-gateway
    restart: unless-stopped
    networks: [aichathub]
    env_file: [./services/ai-gateway-service/.env]
    depends_on: [postgres, redis]
    # 512m was undersized for an Octane worker's actual memory profile — Swoole
    # workers are long-lived and accumulate across requests (unlike PHP-FPM, which
    # resets per request), and this service holds image/document base64 payloads and
    # conversation history in memory per request. Confirmed live: sitting at ~95% of
    # 512m within hours of a fresh restart, well before any OOM kill actually fired —
    # this was heading for one under real sustained traffic, causing exactly the
    # "works, then randomly doesn't for a moment" pattern reported live. Host has 19GB
    # free (23GB total, ~3.5GB used) — ample room for a generous bump.
    mem_limit: 1536m

  ai-gateway-nginx:
    image: nginx:1.25-alpine
    container_name: aichathub-ai-nginx
    restart: unless-stopped
    networks: [aichathub]
    volumes:
      - ./infrastructure/docker/nginx/ai.conf:/etc/nginx/conf.d/default.conf
    depends_on: [ai-gateway-service]

  ai-gateway-queue-worker:
    build: { context: ., dockerfile: infrastructure/docker/php/Dockerfile, args: { SERVICE_DIR: ai-gateway-service, PHP_FPM_CONF: www.prod.conf } }
    image: aichathub/ai-gateway-service-fpm:prod
    container_name: aichathub-ai-gateway-queue-worker
    restart: unless-stopped
    networks: [aichathub]
    env_file: [./services/ai-gateway-service/.env]
    depends_on: [postgres, redis]
    command: php artisan queue:work redis --queue=ai_gateway --tries=3 --sleep=1
    mem_limit: 256m

  # ─── CHAT SERVICE (Octane/Swoole) ─────────

  # Malware scanning for FileAttachmentController::upload() — internal-only, no
  # published port. Official image ships freshclam auto-updates for the virus DB.
  # CLAMD_CONF_* env vars are required — confirmed live that this image does NOT
  # enable a TCP listener by default (only the unix socket, which ClamAvScanner.php
  # never uses). Without these, clamd starts and freshclam updates fine, but
  # ClamAvScanner's TCP connection gets "Connection refused" — every upload then
  # fails closed with "scanning temporarily unavailable". Confirmed broken in
  # production for 5 days before this fix (container ran "healthy"-looking the whole
  # time except for the `unhealthy` healthcheck status, which went unnoticed).
  clamav:
    image: clamav/clamav:stable
    container_name: aichathub-clamav
    restart: unless-stopped
    networks: [aichathub]
    environment:
      CLAMD_CONF_TCPSocket: 3310
      CLAMD_CONF_TCPAddr: 0.0.0.0
    # 1024m was OOM-killing clamd mid-boot while it loaded the default signature set
    # into memory (confirmed live via dmesg: cgroup OOM killed clamd's PID while its
    # anon-rss was still climbing past ~584MB and hadn't finished loading) — clamd's
    # actual working set with the full default database needs more headroom than that.
    # Host has ample free RAM; this is a generous bump, not a tight fit.
    mem_limit: 2048m
    # The image's own baked-in healthcheck (clamdcheck.sh) runs `nc localhost 3310` —
    # confirmed live that `localhost` resolves to ::1 first in this container's
    # /etc/hosts, but TCPAddr above only binds IPv4 (0.0.0.0), so the IPv6 attempt
    # fails and nc never falls back to 127.0.0.1. Functionally harmless (the real
    # connection path other services use is the hostname "clamav", which resolves
    # fine and works), but an always-"unhealthy" container is exactly the kind of
    # ambiguous status that let the original TCP-listener bug hide for 5 days
    # unnoticed — overriding with an explicit IPv4 check instead of trusting the
    # image's default.
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc 127.0.0.1 3310 | grep -q PONG"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 360s

  chat-service:
    build: { context: ., dockerfile: infrastructure/docker/php-octane/Dockerfile, args: { SERVICE_DIR: chat-service } }
    image: aichathub/chat-service:prod
    container_name: aichathub-chat
    restart: unless-stopped
    networks: [aichathub]
    env_file: [./services/chat-service/.env]
    depends_on: [postgres, redis, clamav]
    # See ai-gateway-service's identical comment above — same Octane memory-growth
    # issue, same live-confirmed ~95%-of-512m headroom problem, same fix.
    mem_limit: 1536m

  chat-nginx:
    image: nginx:1.25-alpine
    container_name: aichathub-chat-nginx
    restart: unless-stopped
    networks: [aichathub]
    volumes:
      - ./infrastructure/docker/nginx/chat.conf:/etc/nginx/conf.d/default.conf
    depends_on: [chat-service]

  # Runs chat:expire-private-sessions on a schedule (see chat-service/routes/console.php) —
  # same schedule:work-must-run-continuously pattern as wallet/subscription/payment-scheduler.
  chat-scheduler:
    image: aichathub/chat-service:prod
    container_name: aichathub-chat-scheduler
    restart: unless-stopped
    networks: [aichathub]
    env_file: [./services/chat-service/.env]
    depends_on: [postgres, redis]
    command: php artisan schedule:work
    mem_limit: 192m

  # ─── BILLING SERVICE ──────────────────────

  billing-service:
    build: { context: ., dockerfile: infrastructure/docker/php/Dockerfile, args: { SERVICE_DIR: billing-service, PHP_FPM_CONF: www.prod.conf } }
    image: aichathub/billing-service:prod
    container_name: aichathub-billing
    restart: unless-stopped
    networks: [aichathub]
    env_file: [./services/billing-service/.env]
    depends_on: [postgres, redis]
    mem_limit: 384m

  billing-nginx:
    image: nginx:1.25-alpine
    container_name: aichathub-billing-nginx
    restart: unless-stopped
    networks: [aichathub]
    volumes:
      - ./infrastructure/docker/nginx/billing.conf:/etc/nginx/conf.d/default.conf
    depends_on: [billing-service]

  # ─── NOTIFICATION SERVICE ─────────────────

  notification-service:
    build: { context: ., dockerfile: infrastructure/docker/php/Dockerfile, args: { SERVICE_DIR: notification-service, PHP_FPM_CONF: www.prod.conf } }
    image: aichathub/notification-service:prod
    container_name: aichathub-notification
    restart: unless-stopped
    networks: [aichathub]
    env_file: [./services/notification-service/.env]
    depends_on: [postgres, redis]
    mem_limit: 384m

  notification-nginx:
    image: nginx:1.25-alpine
    container_name: aichathub-notification-nginx
    restart: unless-stopped
    networks: [aichathub]
    volumes:
      - ./infrastructure/docker/nginx/notification.conf:/etc/nginx/conf.d/default.conf
    depends_on: [notification-service]

  # ─── API GATEWAY ──────────────────────────

  api-gateway:
    build: { context: ., dockerfile: infrastructure/docker/php/Dockerfile, args: { SERVICE_DIR: api-gateway, PHP_FPM_CONF: www.prod.conf } }
    image: aichathub/api-gateway:prod
    container_name: aichathub-api-gateway
    restart: unless-stopped
    networks: [aichathub]
    env_file: [./services/api-gateway/.env]
    depends_on:
      - auth-service
      - subscription-service
      - wallet-service
      - payment-service
      - ai-gateway-service
      - chat-service
    mem_limit: 384m

  api-gateway-nginx:
    image: nginx:1.25-alpine
    container_name: aichathub-gateway-nginx
    restart: unless-stopped
    networks: [aichathub]
    volumes:
      - ./infrastructure/docker/nginx/gateway.conf:/etc/nginx/conf.d/default.conf
    depends_on: [api-gateway]

  # ─── FRONTEND ─────────────────────────────
  # NEXT_PUBLIC_* values are baked in at `npm run build` time from
  # frontend/.env.production (see frontend/.env.production.example) — NOT read from
  # this service's `environment:` at runtime, so nothing is set here for them. That
  # file must exist with real values before `docker-compose ... build frontend` runs.

  frontend:
    build: { context: ./frontend, dockerfile: Dockerfile }
    image: aichathub/frontend:prod
    container_name: aichathub-frontend
    restart: unless-stopped
    networks: [aichathub]
    depends_on: [api-gateway]
    mem_limit: 512m
