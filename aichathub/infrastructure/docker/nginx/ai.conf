server {
    listen 80;
    server_name _;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    client_max_body_size 25M;
    charset utf-8;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ /\.(?!well-known).* { deny all; }

    # Octane (Swoole) serves the whole app directly — no static-file/PHP split to
    # make like there was with php-fpm, so one location block handles everything.
    # Buffering off matters for every route here, not just chat streaming: Octane
    # is the sole runtime for this service, and this proxy is its only front door.
    location / {
        proxy_pass http://ai-gateway-service:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_buffering off;
        proxy_cache off;
    }
}
