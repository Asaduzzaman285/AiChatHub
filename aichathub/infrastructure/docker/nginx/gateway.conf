server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # Max upload size
    client_max_body_size 25M;

    charset utf-8;

    # Docker's embedded DNS re-resolves the upstream IP on each request (short TTL)
    # instead of nginx caching it once at startup — without this, recreating the
    # php-fpm container (a routine redeploy) leaves nginx silently forwarding to
    # whatever container now holds the old IP.
    resolver 127.0.0.11 valid=10s;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        set $php_upstream api-gateway:9000;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PHP_VALUE "error_log=/var/log/nginx/php_errors.log";
        fastcgi_param HTTP_HOST $host;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param SERVER_PORT $server_port;
        fastcgi_param HTTPS off;
        fastcgi_read_timeout 300;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # SSE streaming — disable buffering for AI responses. fastcgi_read_timeout is set
    # explicitly here (not inherited from the ~ \.php$ block above — sibling location
    # blocks don't share directives) — without it this silently falls back to nginx's
    # 60s default, which kills long-running document/large-context chat responses mid-
    # stream (confirmed live: cURL error 18 "transfer closed with outstanding read data
    # remaining" from api-gateway's proxy to ai-gateway once a response passed ~60s).
    location ~ ^/api/v1/chat {
        try_files $uri $uri/ /index.php?$query_string;
        set $php_upstream api-gateway:9000;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffering off;
        proxy_buffering off;
        proxy_cache off;
    }
}