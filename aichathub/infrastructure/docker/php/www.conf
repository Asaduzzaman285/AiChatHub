; Only overriding pool sizing here — user/group/listen are already handled
; correctly by the base php:8.3-fpm-alpine image's own zz-docker.conf, loaded
; after this file; no need to redeclare them and risk a conflict.
[www]

; Previously left at the image's factory default (max_children = 5) — far too low
; even for this dev host; every service backed by this pool shared the same
; 5-concurrent-request ceiling. Bumped to a moderate value sized for a single
; Docker Desktop/WSL2 host running 7 of these pools side by side alongside
; Postgres/Redis/the 2 Octane services — not a production sizing exercise, just
; enough headroom that ordinary concurrent testing doesn't queue behind 5 slots.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
