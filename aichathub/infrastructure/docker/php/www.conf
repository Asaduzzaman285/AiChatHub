; Only overriding pool sizing here — user/group/listen are already handled
; correctly by the base php:8.3-fpm-alpine image's own zz-docker.conf, loaded
; after this file; no need to redeclare them and risk a conflict.
[www]

; Factory default (max_children=5) was too low; the first attempt at raising it
; (20/4/2/6) turned out to be too high for THIS host — confirmed 2026-08-03 the
; host is only 4 CPU cores / 7.9GB RAM total, with Docker Desktop's own WSL2 VM
; capped to 2 CPUs / ~3GB (.wslconfig). At start_servers=4 across 7 services
; sharing this pool, that's 28 idle php-fpm workers running at all times before
; a single request even arrives — real baseline overhead this VM doesn't have
; to spare. Settled on a smaller uplift instead: still meaningfully better than
; the original 5-request ceiling, without the heavy idle footprint.
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
