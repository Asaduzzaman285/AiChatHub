; Production pool sizing — this file is separate from the dev-tuned www.conf
; specifically because the two environments' hosts are nowhere close in size.
; www.conf's own comment documents it was tuned for a 4-core/7.9GB dev laptop
; (Docker Desktop's WSL2 VM further capped to 2 CPUs/~3GB). That value shipped
; unchanged into production and was confirmed via load testing (2026-08-16,
; k6 ramp to 1000 concurrent requests against a single service) to cap the
; whole pool at 8 concurrent requests regardless of the host's real capacity —
; requests queued for a free worker slot instead of failing outright, so error
; rate stayed at 0% while p95 latency on a trivial in-memory endpoint rose to
; 5.46s. Not a hardware ceiling: the production host is 8 CPU cores / 23GB RAM,
; almost entirely idle during that test.
;
; Sizing math: observed ~37MB RSS per active php-fpm worker (`ps` inside a
; running container). 7 services share this pool config. Budgeting ~6-9GB for
; Postgres/Redis/the 2 Octane services/frontend/OS overhead leaves roughly
; 14-17GB for php-fpm workers — at 32 workers/service that's a ~9GB worst case
; if all 7 services hit their cap simultaneously, well inside the real budget.
[www]

pm = dynamic
pm.max_children = 32
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 12
pm.max_requests = 500
