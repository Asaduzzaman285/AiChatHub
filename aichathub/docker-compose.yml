version: '3.8'

# ─────────────────────────────────────────────
# AI ChatHub — Local Development Environment
# ─────────────────────────────────────────────

networks:
  aichathub:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  storage-data:

services:

  # ─── INFRASTRUCTURE ───────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: aichathub-postgres
    restart: unless-stopped
    networks: [aichathub]
    environment:
      POSTGRES_DB: ai_chathub_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: aichathub-redis
    restart: unless-stopped
    networks: [aichathub]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  mailpit:
    image: axllent/mailpit:latest
    container_name: aichathub-mailpit
    restart: unless-stopped
    networks: [aichathub]
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI → http://localhost:8025

  minio:
    image: minio/minio:latest
    container_name: aichathub-minio
    restart: unless-stopped
    networks: [aichathub]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"   # Web UI → http://localhost:9001
    volumes:
      - storage-data:/data
    command: server /data --console-address ":9001"

  # ─── AUTH SERVICE ─────────────────────────

  auth-service:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile
      args: { SERVICE_DIR: auth-service }
    container_name: aichathub-auth
    restart: unless-stopped
    networks: [aichathub]
    volumes:
      - ./services/auth-service:/var/www
    env_file:
      - ./services/auth-service/.env
    depends_on: [postgres, redis]

  auth-nginx:
    image: nginx:1.25-alpine
    container_name: aichathub-auth-nginx
    restart: unless-stopped
    networks: [aichathub]
    ports:
      - "8001:80"
    volumes:
      - ./services/auth-service:/var/www
      - ./infrastructure/docker/nginx/auth.conf:/etc/nginx/conf.d/default.conf
    depends_on: [auth-service]

  # Same image/code as auth-service, just runs `queue:work` instead of php-fpm.
  # Without this, the SendVerificationEmail listener (ShouldQueue) never actually
  # runs — verification emails silently never get created — and used to require
  # manually `docker exec -d`-ing a worker in by hand after every `up`.
  auth-queue-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile
      args: { SERVICE_DIR: auth-service }
    container_name: aichathub-auth-queue-worker
    restart: unless-stopped
    networks: [aichathub]
    volumes:
      - ./services/auth-service:/var/www
    env_file:
      - ./services/auth-service/.env
    depends_on: [postgres, redis]
    command: php artisan queue:work redis --queue=auth --tries=3 --sleep=3

  # ─── SUBSCRIPTION SERVICE ─────────────────

  subscription-service:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile
      args: { SERVICE_DIR: subscription-service }
    container_name: aichathub-subscription
    restart: unless-stopped
    networks: [aichathub]
    volumes:
      - ./services/subscription-service:/var/www
    env_file:
      - ./services/subscription-service/.env
    depends_on: [postgres, redis]

  subscription-nginx:
    image: nginx:1.25-alpine
    container_name: aichathub-subscription-nginx
    restart: unless-stopped
    networks: [aichathub]
    ports:
      - "8002:80"
    volumes:
      - ./services/subscription-service:/var/www
      - ./infrastructure/docker/nginx/subscription.conf:/etc/nginx/conf.d/default.conf
    depends_on: [subscription-service]

  # Same image/code as subscription-service — runs `queue:work` instead of php-fpm.
  # Without this, ProcessRenewalJob (dispatched by renewals:process, and by itself
  # on a 24h delay after a failed attempt) never actually runs.
  subscription-queue-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile
      args: { SERVICE_DIR: subscription-service }
    container_name: aichathub-subscription-queue-worker
    restart: unless-stopped
    networks: [aichathub]
    volumes:
      - ./services/subscription-service:/var/www
    env_file:
      - ./services/subscription-service/.env
    depends_on: [postgres, redis]
    # --timeout=120, not the queue:work default of 60s: ProcessRenewalJob can
    # legitimately chain two sequential 15s HTTP timeouts (wallet, then a
    # saved-card fallback) in this environment's slower cross-service calls —
    # the worker's own timeout would otherwise kill and auto-retry a job that
    # was still genuinely working, duplicating a charge attempt.
    command: php artisan queue:work redis --queue=subscription --tries=3 --sleep=3 --timeout=120

  # Long-running `schedule:work` process — the thing that actually fires
  # `renewals:process` on its `->hourly()` schedule (routes/console.php).
  # `schedule:run` alone only fires whatever's due at the instant it's called;
  # this keeps checking every minute so the hourly schedule actually happens
  # without needing host-level cron.
  subscription-scheduler:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile
      args: { SERVICE_DIR: subscription-service }
    container_name: aichathub-subscription-scheduler
    restart: unless-stopped
    networks: [aichathub]
    volumes:
      - ./services/subscription-service:/var/www
    env_file:
      - ./services/subscription-service/.env
    depends_on: [postgres, redis]
    command: php artisan schedule:work

  # ─── WALLET SERVICE ───────────────────────

  wallet-service:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile
      args: { SERVICE_DIR: wallet-service }
    container_name: aichathub-wallet
    restart: unless-stopped
    networks: [aichathub]
    volumes:
      - ./services/wallet-service:/var/www
    env_file:
      - ./services/wallet-service/.env
    depends_on: [postgres, redis]

  wallet-nginx:
    image: nginx:1.25-alpine
    container_name: aichathub-wallet-nginx
    restart: unless-stopped
    networks: [aichathub]
    ports:
      - "8003:80"
    volumes:
      - ./services/wallet-service:/var/www
      - ./infrastructure/docker/nginx/wallet.conf:/etc/nginx/conf.d/default.conf
    depends_on: [wallet-service]

  # Processes TriggerAutoDebitJob (queue=wallet), dispatched from WalletService::deduct()
  # when a balance crosses a user's configured auto-debit threshold. Queued deliberately —
  # without a worker consuming it, the job just sits in the jobs table forever.
  wallet-queue-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile
      args: { SERVICE_DIR: wallet-service }
    container_name: aichathub-wallet-queue-worker
    restart: unless-stopped
    networks: [aichathub]
    volumes:
      - ./services/wallet-service:/var/www
    env_file:
      - ./services/wallet-service/.env
    depends_on: [postgres, redis]
    command: php artisan queue:work redis --queue=wallet --tries=3 --sleep=3 --timeout=120

  # Runs wallet:reconcile-reservations every 15 minutes — releases wallet
  # reservations that were never settled by a deduct/refund, which can happen
  # if ai-gateway's HTTP call to /wallet/reserve times out on its own side even
  # though the reservation actually landed here. See
  # ReconcileWalletReservationsCommand for the full reasoning.
  wallet-scheduler:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile
      args: { SERVICE_DIR: wallet-service }
    container_name: aichathub-wallet-scheduler
    restart: unless-stopped
    networks: [aichathub]
    volumes:
      - ./services/wallet-service:/var/www
    env_file:
      - ./services/wallet-service/.env
    depends_on: [postgres, redis]
    command: php artisan schedule:work

  # ─── PAYMENT SERVICE ──────────────────────

  payment-service:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile
      args: { SERVICE_DIR: payment-service }
    container_name: aichathub-payment
    restart: unless-stopped
    networks: [aichathub]
    volumes:
      - ./services/payment-service:/var/www
    env_file:
      - ./services/payment-service/.env
    depends_on: [postgres, redis]

  payment-nginx:
    image: nginx:1.25-alpine
    container_name: aichathub-payment-nginx
    restart: unless-stopped
    networks: [aichathub]
    ports:
      - "8004:80"
    volumes:
      - ./services/payment-service:/var/www
      - ./infrastructure/docker/nginx/payment.conf:/etc/nginx/conf.d/default.conf
    depends_on: [payment-service]

  # Without this, ProcessStripeWebhookJob (dispatched by the Stripe webhook
  # controller) and ReconcileBkashPaymentJob (dispatched by bkash:reconcile)
  # never actually run — both are ShouldQueue jobs with nothing to process
  # them before this was added (found live while auditing production-readiness).
  payment-queue-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile
      args: { SERVICE_DIR: payment-service }
    container_name: aichathub-payment-queue-worker
    restart: unless-stopped
    networks: [aichathub]
    volumes:
      - ./services/payment-service:/var/www
    env_file:
      - ./services/payment-service/.env
    depends_on: [postgres, redis]
    command: php artisan queue:work redis --queue=payment --tries=3 --sleep=3 --timeout=120

  # Long-running `schedule:work` process — fires `bkash:reconcile` on its
  # `->everyFifteenMinutes()` schedule (routes/console.php).
  payment-scheduler:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile
      args: { SERVICE_DIR: payment-service }
    container_name: aichathub-payment-scheduler
    restart: unless-stopped
    networks: [aichathub]
    volumes:
      - ./services/payment-service:/var/www
    env_file:
      - ./services/payment-service/.env
    depends_on: [postgres, redis]
    command: php artisan schedule:work

  # ─── AI GATEWAY SERVICE ───────────────────

  # Runs Laravel Octane (Swoole) instead of php-fpm — chat streaming holds a worker
  # blocked for the full AI response duration, which php-fpm's pool size caps hard;
  # Octane's event loop removes that 1:1 process-per-connection ceiling. Built from a
  # dedicated Dockerfile (infrastructure/docker/php-octane), not the shared php-fpm one
  # every other service uses — this is the only service in the compose file that needs
  # the swoole/sockets extensions. Serves HTTP directly on :8000; ai-gateway-nginx below
  # reverse-proxies to it instead of using fastcgi_pass.
  ai-gateway-service:
    build:
      context: .
      dockerfile: infrastructure/docker/php-octane/Dockerfile
      args: { SERVICE_DIR: ai-gateway-service }
    container_name: aichathub-ai-gateway
    restart: unless-stopped
    networks: [aichathub]
    volumes:
      - ./services/ai-gateway-service:/var/www
    env_file:
      - ./services/ai-gateway-service/.env
    depends_on: [postgres, redis]

  ai-gateway-nginx:
    image: nginx:1.25-alpine
    container_name: aichathub-ai-nginx
    restart: unless-stopped
    networks: [aichathub]
    ports:
      - "8005:80"
    volumes:
      - ./infrastructure/docker/nginx/ai.conf:/etc/nginx/conf.d/default.conf
    depends_on: [ai-gateway-service]

  # Runs ReleaseWalletReservationJob — releases a wallet reservation left over from
  # a chat request that failed (bad provider key, rate limit, etc.). See
  # bootstrap/app.php's terminating() callback for why this has to be a queued job
  # rather than a direct call. Without this worker, failed chat requests silently
  # leave money "stuck" in reserved_balance forever. Stays on the shared php-fpm image
  # deliberately — it only ever runs `queue:work`, never serves HTTP, so it has no
  # need for Octane/Swoole.
  ai-gateway-queue-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile
      args: { SERVICE_DIR: ai-gateway-service }
    container_name: aichathub-ai-gateway-queue-worker
    restart: unless-stopped
    networks: [aichathub]
    volumes:
      - ./services/ai-gateway-service:/var/www
    env_file:
      - ./services/ai-gateway-service/.env
    depends_on: [postgres, redis]
    command: php artisan queue:work redis --queue=ai_gateway --tries=3 --sleep=1

  # ─── CHAT SERVICE ─────────────────────────

  # No `clamav` service here on purpose — CLAMAV_ENABLED=false in chat-service/.env
  # for local dev (clamd's resident ~800MB virus DB is heavy on a memory-constrained
  # dev machine). Production (docker-compose.prod.yml) still runs it with scanning on.
  # Uncomment below if you need to test scanning locally (also flip CLAMAV_ENABLED=true).
  # CLAMD_CONF_* vars are required — confirmed live that this image doesn't enable a
  # TCP listener by default (ClamAvScanner.php connects via TCP, not the unix socket).
  # mem_limit matters here too — confirmed live in prod that 1024m OOM-kills clamd
  # mid-boot while it loads the default signature set (needs closer to 2GB headroom).
  # The image's own healthcheck (`nc localhost 3310`) also false-negatives in-container
  # since "localhost" resolves ::1 first while TCPAddr only binds IPv4 — see prod
  # compose's explicit 127.0.0.1 healthcheck override if you want an accurate status
  # locally too.
  # clamav:
  #   image: clamav/clamav:stable
  #   container_name: aichathub-clamav
  #   restart: unless-stopped
  #   networks: [aichathub]
  #   environment:
  #     CLAMD_CONF_TCPSocket: 3310
  #     CLAMD_CONF_TCPAddr: 0.0.0.0
  #   mem_limit: 2048m

  # Octane (Swoole) — same reasoning as ai-gateway-service above; chat-service also has
  # the streaming SSE endpoint (see FileAttachmentController/message streaming) that
  # holds a php-fpm worker open for the full response otherwise.
  chat-service:
    build:
      context: .
      dockerfile: infrastructure/docker/php-octane/Dockerfile
      args: { SERVICE_DIR: chat-service }
    container_name: aichathub-chat
    restart: unless-stopped
    networks: [aichathub]
    volumes:
      - ./services/chat-service:/var/www
    env_file:
      - ./services/chat-service/.env
    depends_on: [postgres, redis]

  chat-nginx:
    image: nginx:1.25-alpine
    container_name: aichathub-chat-nginx
    restart: unless-stopped
    networks: [aichathub]
    ports:
      - "8006:80"
    volumes:
      - ./infrastructure/docker/nginx/chat.conf:/etc/nginx/conf.d/default.conf
    depends_on: [chat-service]

  # Runs chat:expire-private-sessions on a schedule (see chat-service/routes/console.php) —
  # same schedule:work-must-run-continuously pattern as wallet/subscription/payment-scheduler.
  chat-scheduler:
    build:
      context: .
      dockerfile: infrastructure/docker/php-octane/Dockerfile
      args: { SERVICE_DIR: chat-service }
    container_name: aichathub-chat-scheduler
    restart: unless-stopped
    networks: [aichathub]
    volumes:
      - ./services/chat-service:/var/www
    env_file:
      - ./services/chat-service/.env
    depends_on: [postgres, redis]
    command: php artisan schedule:work

  # ─── BILLING SERVICE ──────────────────────

  billing-service:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile
      args: { SERVICE_DIR: billing-service }
    container_name: aichathub-billing
    restart: unless-stopped
    networks: [aichathub]
    volumes:
      - ./services/billing-service:/var/www
    env_file:
      - ./services/billing-service/.env
    depends_on: [postgres, redis]

  billing-nginx:
    image: nginx:1.25-alpine
    container_name: aichathub-billing-nginx
    restart: unless-stopped
    networks: [aichathub]
    ports:
      - "8007:80"
    volumes:
      - ./services/billing-service:/var/www
      - ./infrastructure/docker/nginx/billing.conf:/etc/nginx/conf.d/default.conf
    depends_on: [billing-service]

  # ─── NOTIFICATION SERVICE ─────────────────

  notification-service:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile
      args: { SERVICE_DIR: notification-service }
    container_name: aichathub-notification
    restart: unless-stopped
    networks: [aichathub]
    volumes:
      - ./services/notification-service:/var/www
    env_file:
      - ./services/notification-service/.env
    depends_on: [postgres, redis]

  notification-nginx:
    image: nginx:1.25-alpine
    container_name: aichathub-notification-nginx
    restart: unless-stopped
    networks: [aichathub]
    ports:
      - "8008:80"
    volumes:
      - ./services/notification-service:/var/www
      - ./infrastructure/docker/nginx/notification.conf:/etc/nginx/conf.d/default.conf
    depends_on: [notification-service]

  # ─── API GATEWAY ──────────────────────────

  api-gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile
      args: { SERVICE_DIR: api-gateway }
    container_name: aichathub-api-gateway
    restart: unless-stopped
    networks: [aichathub]
    volumes:
      - ./services/api-gateway:/var/www
    env_file:
      - ./services/api-gateway/.env
    depends_on:
      - auth-service
      - subscription-service
      - wallet-service
      - payment-service
      - ai-gateway-service
      - chat-service

  api-gateway-nginx:
    image: nginx:1.25-alpine
    container_name: aichathub-gateway-nginx
    restart: unless-stopped
    networks: [aichathub]
    ports:
      - "8000:80"
    volumes:
      - ./services/api-gateway:/var/www
      - ./infrastructure/docker/nginx/gateway.conf:/etc/nginx/conf.d/default.conf
    depends_on: [api-gateway]

  # ─── FRONTEND ─────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aichathub-frontend
    restart: unless-stopped
    networks: [aichathub]
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on: [api-gateway]
